[workspace]
members = ["crates/*", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Tanner"]
license = "MIT"

[profile.release]
# A control centre sits resident for hours; favour a small, fast binary over
# fast rebuilds. LTO + one codegen unit is worth the extra link time here.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
