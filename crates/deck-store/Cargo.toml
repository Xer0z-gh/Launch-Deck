[package]
name = "deck-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
chrono = "0.4.45"
deck-domain = { version = "0.1.0", path = "../deck-domain" }
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "macros", "migrate"] }
thiserror = "2.0.19"
tracing = "0.1.44"
uuid = "1.24.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }
