[meta]
id = "vite"
name = "Vite"
language = "TypeScript"
framework = "Vite"
icon = "zap"
priority = 250
default_ports = [5173]

[[detect]]
file_exists = "package.json"

[[detect]]
any_of = [
  { json_key_exists = { file = "package.json", pointer = "devDependencies/vite" } },
  { json_key_exists = { file = "package.json", pointer = "dependencies/vite" } },
]

# Tauri projects also carry Vite; that runner outranks this one, so no
# exclusion rule is needed here.

[version]
json = { file = "package.json", pointer = "version" }

[[vars]]
name = "pm"
default = "npm"
cases = [
  { value = "pnpm", when = { file_exists = "pnpm-lock.yaml" } },
  { value = "yarn", when = { file_exists = "yarn.lock" } },
  { value = "bun",  when = { file_exists = "bun.lockb" } },
]

[commands.run]
exec = { program = "{pm}", args = ["run", "dev"] }

[commands.install]
exec = { program = "{pm}", args = ["install"] }

[commands.build]
exec = { program = "{pm}", args = ["run", "build"] }

[health]
log_contains = { text = "ready in" }

# Setup detection. Read-only, like every detection rule: the launcher must
# never execute anything just to describe a project.
#
# Without this, a project with no node_modules reported as a CRASH several
# seconds after the user pressed Run -- the failure was on disk the whole time
# and 6 of 29 projects in a real registry were in exactly this state.
[[setup]]
when_file_exists = "package.json"
requires_any = ["node_modules"]
hint = "Dependencies are not installed"
